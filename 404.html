<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Iron Nest Wiki - Guide, Missions & Calculator</title>
    <meta
      name="description"
      content="Fan-made Iron Nest wiki for beginner guides, mission walkthroughs, triangulation, shell choices, counter-battery tips, endings, and roadmap updates."
    />
    <meta
      name="keywords"
      content="Iron Nest, guide, missions, triangulation, shell types, endings, calculator"
    />
    <script>
      (() => {
        const repoBase = '/iron-nest-wiki';
        window.__APP_BASE_PATH__ =
          window.location.pathname === repoBase || window.location.pathname.startsWith(`${repoBase}/`) ? repoBase : '';

        const stylesheet = document.createElement('link');
        stylesheet.rel = 'stylesheet';
        stylesheet.href = `${window.__APP_BASE_PATH__}/src/styles.css`;
        document.head.appendChild(stylesheet);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script>
      (() => {
        const app = document.createElement('script');
        app.type = 'module';
        app.src = `${window.__APP_BASE_PATH__ || ''}/src/main.js`;
        document.body.appendChild(app);
      })();
    </script>
  </body>
</html>
